{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title mb-4">Receive Stock</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Supplier Name</label>
                        <input type="text" name="supplier" class="form-control" placeholder="e.g. Mumias Distributors" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Select Product</label>
                        <select name="product_id" class="form-select" required>
                            {% for p in products %}
                            <option value="{{ p.id }}">{{ p.name }} (Current Stock: {{ p.quantity }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantity Received</label>
                        <input type="number" name="quantity" class="form-control" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Confirm Delivery</button>
                    <a href="{{ url_for('main.products') }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
